<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Community Tasks | FORGE</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- FORGE Global CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Tasks CSS -->
    <link rel="stylesheet" href="css/tasks.css">

</head>


<body>


<!-- ======================================
     FORGE HEADER
====================================== -->

<header class="topbar">

    <img
        src="assets/forge-logo.png"
        alt="FORGE"
        class="dashboard-logo"
    >

    <button
        class="notifications-btn"
        type="button"
        aria-label="Notifications"
    >
        <i class="fa-regular fa-bell"></i>
    </button>

</header>


<!-- ======================================
     PAGE
====================================== -->

<main class="tasks-container">


    <!-- Back -->

    <a
        href="tasks.html"
        class="back-btn"
    >
        <i class="fa-solid fa-arrow-left"></i>
        Tasks
    </a>


    <!-- Page Header -->

    <section class="page-header">

        <h1>Community</h1>

        <p>
            Support and join the Gentle Warrior community
        </p>

    </section>


    <!-- ======================================
         COMMUNITY TASKS
    ====================================== -->

    <section class="task-group">

        <div class="task-group-header">

            <div class="task-group-icon community-icon">

                <i class="fa-solid fa-users"></i>

            </div>

            <div>

                <h2>Community</h2>

                <p>
                    Support and join the Gentle Warrior community
                </p>

            </div>

        </div>


        <!-- ==================================
             TASK 1
        ================================== -->

        <button
            class="task-card"
            type="button"
            data-task="follow_baby_leam"
        >

            <div class="task-card-icon">

                <i class="fa-brands fa-facebook-f"></i>

            </div>


            <div class="task-card-content">

                <h3>
                    Follow Baby Leam's Page
                </h3>

                <span>
                    Follow the page and submit proof
                </span>

            </div>


            <div class="task-card-reward">

                <strong>+1</strong>

                <small>SPARK</small>

            </div>


            <div class="task-arrow">

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </button>


        <!-- ==================================
             TASK 2
        ================================== -->

        <button
            class="task-card"
            type="button"
            data-task="follow_gentle_warrior"
        >

            <div class="task-card-icon">

                <i class="fa-brands fa-facebook-f"></i>

            </div>


            <div class="task-card-content">

                <h3>
                    Follow Gentle Warrior's Page
                </h3>

                <span>
                    Follow the page and submit proof
                </span>

            </div>


            <div class="task-card-reward">

                <strong>+1</strong>

                <small>SPARK</small>

            </div>


            <div class="task-arrow">

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </button>


        <!-- ==================================
             TASK 17
        ================================== -->

        <button
            class="task-card"
            type="button"
            data-task="join_messenger_gc"
        >

            <div class="task-card-icon">

                <i class="fa-brands fa-facebook-messenger"></i>

            </div>


            <div class="task-card-content">

                <h3>
                    Join our Messenger GC
                </h3>

                <span>
                    Join the Gentle Warrior community chat
                </span>

            </div>


            <div class="task-card-reward">

                <strong>+1</strong>

                <small>SPARK</small>

            </div>


            <div class="task-arrow">

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </button>


        <!-- ==================================
             TASK 18
        ================================== -->

        <button
            class="task-card"
            type="button"
            data-task="join_tg_community"
        >

            <div class="task-card-icon">

                <i class="fa-brands fa-telegram"></i>

            </div>


            <div class="task-card-content">

                <h3>
                    Join our TG Community
                </h3>

                <span>
                    Join the Gentle Warrior Telegram community
                </span>

            </div>


            <div class="task-card-reward">

                <strong>+1</strong>

                <small>SPARK</small>

            </div>


            <div class="task-arrow">

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </button>


        <!-- ==================================
             TASK 19
        ================================== -->

        <button
            class="task-card"
            type="button"
            data-task="join_x_community"
        >

            <div class="task-card-icon">

                <i class="fa-brands fa-x-twitter"></i>

            </div>


            <div class="task-card-content">

                <h3>
                    Join our X Community
                </h3>

                <span>
                    Join the Gentle Warrior X community
                </span>

            </div>


            <div class="task-card-reward">

                <strong>+1</strong>

                <small>SPARK</small>

            </div>


            <div class="task-arrow">

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </button>

    </section>


</main>


<!-- ======================================
     TASK MODAL
====================================== -->

<div
    class="task-modal"
    id="taskModal"
>

    <div class="task-modal-card">

        <button
            class="task-modal-close"
            type="button"
            aria-label="Close"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>


        <div id="taskModalContent">

            <!-- Task content loaded by JS -->

        </div>

    </div>

</div>


<!-- Tasks JS -->

<script src="js/tasks.js"></script>


</body>

</html>
