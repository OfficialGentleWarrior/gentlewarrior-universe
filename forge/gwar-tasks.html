<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GWAR / Web3 Tasks | FORGE</title>

    <meta
        name="description"
        content="Explore and support the GWAR ecosystem"
    >

    <!-- Tasks CSS -->
    <link
        rel="stylesheet"
        href="css/tasks.css"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>


<body>


<!-- ======================================
     FORGE HEADER
====================================== -->

<header class="topbar">

    <img
        src="assets/logo/forge-header.png"
        alt="FORGE"
        class="dashboard-logo"
    >


    <button
        id="notificationsBtn"
        class="notifications-btn"
        type="button"
        aria-label="Notifications"
    >

        <i class="fa-regular fa-bell"></i>

    </button>

</header>



<!-- ======================================
     PAGE
====================================== -->

<main class="tasks-container">


    <!-- ==================================
         BACK
    ================================== -->

    <a
        href="tasks.html"
        class="back-btn"
    >

        <i class="fa-solid fa-arrow-left"></i>

        Tasks

    </a>



    <!-- ==================================
         PAGE HEADER
    ================================== -->

    <section class="page-header">

        <h1>
            GWAR / Web3
        </h1>

        <p>
            Explore and support the GWAR ecosystem
        </p>

    </section>



    <!-- ======================================
         GWAR / WEB3 TASKS
    ====================================== -->

    <section class="task-group">


        <!-- ==================================
             GROUP HEADER
        ================================== -->

        <div class="task-group-header">

            <div class="task-group-icon gwar-icon">

                <i class="fa-solid fa-coins"></i>

            </div>


            <div>

                <h2>
                    GWAR / Web3
                </h2>

                <p>
                    Explore and support the GWAR ecosystem
                </p>

            </div>

        </div>



        <!-- ==================================
             TASK 7
        ================================== -->

        <button
            class="task-card"
            type="button"
            data-task="click_dex_screener_rocket"
        >

            <div class="task-card-icon">

                <i class="fa-solid fa-rocket"></i>

            </div>


            <div class="task-card-content">

                <h3>
                    Click the 🚀 on Dex Screener
                </h3>

                <span>
                    Open Dex Screener and click the 🚀
                </span>

            </div>


            <div class="task-card-reward">

                <strong>
                    +1
                </strong>

                <small>
                    SPARK
                </small>

            </div>


            <div class="task-arrow">

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </button>


    </section>


</main>



<!-- ======================================
     TASK MODAL
====================================== -->

<div
    class="task-modal"
    id="taskModal"
>

    <div class="task-modal-card">


        <button
            class="task-modal-close"
            type="button"
            aria-label="Close"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>


        <div id="taskModalContent">

            <!-- Task content loaded by tasks.js -->

        </div>


    </div>

</div>



<!-- ======================================
     TASKS JS
====================================== -->

<script
    src="js/tasks.js?v=1"
></script>


</body>

</html>
