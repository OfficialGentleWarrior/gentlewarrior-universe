<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Link | FORGE</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <!-- Top Bar -->
    <header class="topbar">
        <img src="assets/logo/forge-header.png"
             alt="FORGE Logo"
             class="dashboard-logo">
    </header>

    <main class="dashboard-container">

        <section class="page-header">
            <h1>Generate Link</h1>
            <p>Create beautiful shareable links in seconds.</p>
        </section>

        <section class="generate-card">

            <!-- Preview Image -->
            <div class="form-group">

                <label for="previewImage">
                    Preview Image
                </label>

                <div class="upload-box" id="uploadBox">

                    <img
                        id="imagePreview"
                        src=""
                        alt="Preview"
                        style="display:none;">

                    <p>📷 Click to upload image</p>

                    <input
                        type="file"
                        id="previewImage"
                        accept="image/*"
                        hidden>

                </div>

            </div>

            <!-- Destination URL -->
            <div class="form-group">

                <label for="destinationUrl">
                    Destination URL
                </label>

                <input
                    type="url"
                    id="destinationUrl"
                    placeholder="https://example.com">

            </div>

            <!-- Title -->
            <div class="form-group">

                <label for="title">
                    Title
                </label>

                <input
                    type="text"
                    id="title"
                    maxlength="60"
                    placeholder="Enter your title">

            </div>

            <!-- Description -->
            <div class="form-group">

                <label for="description">
                    Description (Optional)
                </label>

                <textarea
                    id="description"
                    rows="4"
                    maxlength="160"
                    placeholder="Write a short description..."></textarea>

            </div>

            <!-- Live Preview -->

            <section class="preview-section">

                <h3>Live Preview</h3>

                <div class="link-preview">

                    <img
                        id="previewCardImage"
                        src=""
                        alt=""
                        style="display:none;">

                    <div class="preview-content">

                        <h4 id="previewTitle">
                            Your Title
                        </h4>

                        <p id="previewDescription">
                            Your description will appear here.
                        </p>

                    </div>

                </div>

            </section>

            <!-- Spark Cost -->

            <div class="spark-cost">

                <span>⭐ Cost</span>

                <strong>1 Spark</strong>

            </div>

            <button
                id="generateBtn"
                class="primary-btn"
                disabled>

                Generate Link

            </button>

        </section>

    </main>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/generate-link.js"></script>

</body>
</html>
