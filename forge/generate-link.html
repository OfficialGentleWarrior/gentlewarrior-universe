<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Link | FORGE</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/generate-link.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- Header -->
    <header class="topbar">
        <img src="assets/logo/forge-header.png"
             alt="FORGE"
             class="banner-image">
    </header>

    <main class="dashboard-container">

        <!-- Page Header -->
        <section class="page-header">
            <h1>Generate Link</h1>
            <p>Create beautiful shareable links in seconds.</p>
        </section>

        <!-- Main Card -->
        <section class="generate-card">

            <!-- Preview Image -->
            <div class="form-group">

                <label>Preview Image</label>

                <div class="upload-box" id="uploadBox">

                    <img id="imagePreview"
                         src=""
                         alt="Preview"
                         style="display:none;">

                    <i class="fa-solid fa-camera"></i>

                    <p>Click to upload image</p>

                    <small>PNG, JPG • Max 5 MB</small>
                    <small>Recommended: 1200 × 630 px</small>

                    <input
                        type="file"
                        id="previewImage"
                        accept="image/*"
                        hidden>

                </div>

            </div>

            <!-- Destination URL -->
            <div class="form-group">

                <label for="destinationUrl">
                    Destination URL
                </label>

                <input
                    type="url"
                    id="destinationUrl"
                    placeholder="https://example.com">

            </div>

            <!-- Live Preview -->
            <section class="preview-section">

                <h3>Live Preview</h3>

                <div class="link-preview">

                    <div class="preview-image">

                        <img
                            id="previewCardImage"
                            src=""
                            alt=""
                            style="display:none;">

                        <i id="previewPlaceholder"
                           class="fa-regular fa-image"></i>

                    </div>

                    <div class="preview-content">

                        <small id="previewDomain">
                            gentlewarrior.world
                        </small>

                    </div>

                </div>

            </section>

            <!-- Spark Cost -->
            <div class="spark-cost">

                <span>
                    ⭐ Cost
                </span>

                <strong>
                    1 Spark
                </strong>

            </div>

            <!-- Generate -->
            <button
                id="generateBtn"
                class="primary-btn"
                disabled>

                <i class="fa-solid fa-link"></i>
                Generate Link

            </button>

        </section>

    </main>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/generate-link.js"></script>

</body>
</html>
