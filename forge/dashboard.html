<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard | FORGE</title>

    <meta name="description"
          content="FORGE Dashboard">

    <link rel="stylesheet"
          href="css/dashboard.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header class="topbar">

    <img
        src="assets/logo/forge-header.png"
        alt="FORGE"
        class="dashboard-logo">

    <button
        id="notificationsBtn"
        class="notifications-btn"
        type="button"
        aria-label="Notifications">

        <i class="fa-regular fa-bell"></i>

    </button>

</header>

<div class="dashboard-container">

<button id="logoutBtn" class="logout-btn">
    <i class="fa-solid fa-right-from-bracket"></i>
    Logout
</button>

    <!-- Welcome -->

    <section class="welcome-card">

        <h2>

            Welcome back,

            <span id="userName">

                Loading...

            </span>

            👋

        </h2>

        <p>

            Ready to create your next smart link?

        </p>

    </section>



    <!-- Spark Balance -->

<section class="spark-balance-card">

    <div class="spark-balance-header">

        <div>

            <span class="spark-label">
                ✨ SPARK BALANCE
            </span>

            <h2>
                <span id="credits">0</span>
                <span class="spark-unit">Sparks</span>
            </h2>

        </div>

    </div>

    <div class="spark-balance-actions">

        <a href="wallet.html">
            View History
        </a>

        <a href="#">
            Buy Sparks
        </a>

    </div>

</section>

<!-- Account Role -->

<section class="role-card">

    <div class="role-icon">
        <i class="fa-solid fa-user"></i>
    </div>

    <div class="role-info">

        <span>Account Role</span>

        <strong id="role">
            User
        </strong>

    </div>

</section>



    <!-- Quick Actions -->

    <section class="action-grid">

        <a href="generate-link.html"
   class="action-card">

    <i class="fa-solid fa-link"></i>

    <span>Generate Link</span>

</a>

        <a href="#"
           class="action-card">

            <i class="fa-solid fa-folder-open"></i>

            <span>My Links</span>

        </a>

        <a href="#"
           class="action-card">

            <i class="fa-solid fa-wallet"></i>

            <span>Buy Sparks</span>

        </a>

<a href="rewards.html"
   class="action-card">

    <i class="fa-solid fa-gift"></i>

    <span>Rewards</span>

</a>

    </section>



    <!-- Account -->

    <section class="account-card">

        <h3>

            Account Information

        </h3>

        <div class="info-row">

            <span>Email</span>

            <strong id="userEmail">

                Loading...

            </strong>

        </div>

        <div class="info-row">

            <span>Member Since</span>

            <strong id="memberSince">

                Loading...

            </strong>

        </div>

    </section>

</div>



<script type="module"
        src="js/dashboard.js?v=2"></script>

</body>

</html>
