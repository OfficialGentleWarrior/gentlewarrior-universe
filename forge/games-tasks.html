<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Games Tasks | FORGE</title>

    <meta
        name="description"
        content="Play and reach milestones"
    >

    <!-- Tasks CSS -->
    <link
        rel="stylesheet"
        href="css/tasks.css"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>


<body>


<!-- ======================================
     FORGE HEADER
====================================== -->

<header class="topbar">

    <img
        src="assets/logo/forge-header.png"
        alt="FORGE"
        class="dashboard-logo"
    >


    <button
        id="notificationsBtn"
        class="notifications-btn"
        type="button"
        aria-label="Notifications"
    >

        <i class="fa-regular fa-bell"></i>

    </button>

</header>



<!-- ======================================
     PAGE
====================================== -->

<main class="tasks-container">


    <!-- ==================================
         BACK
    ================================== -->

    <a
        href="tasks.html"
        class="back-btn"
    >

        <i class="fa-solid fa-arrow-left"></i>

        Tasks

    </a>



    <!-- ==================================
         PAGE HEADER
    ================================== -->

    <section class="page-header">

        <h1>
            Games
        </h1>

        <p>
            Play and reach milestones
        </p>

    </section>



    <!-- ======================================
         GAMES TASKS
    ====================================== -->

    <section class="task-group">


        <!-- ==================================
             GROUP HEADER
        ================================== -->

        <div class="task-group-header">

            <div class="task-group-icon games-icon">

                <i class="fa-solid fa-gamepad"></i>

            </div>


            <div>

                <h2>
                    Games
                </h2>

                <p>
                    Play and reach milestones
                </p>

            </div>

        </div>



        <!-- ==================================
             TASK 11
        ================================== -->

        <button
            class="task-card"
            type="button"
            data-task="reach_memory_level_5"
        >

            <div class="task-card-icon">

                <i class="fa-solid fa-brain"></i>

            </div>


            <div class="task-card-content">

                <h3>
                    Reach Level 5 in Memory Game
                </h3>

                <span>
                    Reach Level 5 and submit proof
                </span>

            </div>


            <div class="task-card-reward">

                <strong>
                    +1
                </strong>

                <small>
                    SPARK
                </small>

            </div>


            <div class="task-arrow">

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </button>



        <!-- ==================================
             TASK 12
        ================================== -->

        <button
            class="task-card"
            type="button"
            data-task="reach_heart_defender_level_5"
        >

            <div class="task-card-icon">

                <i class="fa-solid fa-shield-heart"></i>

            </div>


            <div class="task-card-content">

                <h3>
                    Reach Level 5 in Heart Defender
                </h3>

                <span>
                    Reach Level 5 and submit proof
                </span>

            </div>


            <div class="task-card-reward">

                <strong>
                    +1
                </strong>

                <small>
                    SPARK
                </small>

            </div>


            <div class="task-arrow">

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </button>



        <!-- ==================================
             TASK 13
        ================================== -->

        <button
            class="task-card"
            type="button"
            data-task="reach_pillar_match_level_5"
        >

            <div class="task-card-icon">

                <i class="fa-solid fa-shapes"></i>

            </div>


            <div class="task-card-content">

                <h3>
                    Reach Level 5 in Pillar Match
                </h3>

                <span>
                    Reach Level 5 and submit proof
                </span>

            </div>


            <div class="task-card-reward">

                <strong>
                    +1
                </strong>

                <small>
                    SPARK
                </small>

            </div>


            <div class="task-arrow">

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </button>


    </section>


</main>



<!-- ======================================
     TASK MODAL
====================================== -->

<div
    class="task-modal"
    id="taskModal"
>

    <div class="task-modal-card">

        <button
            class="task-modal-close"
            type="button"
            aria-label="Close"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>


        <div id="taskModalContent">

            <!-- Task content loaded by tasks.js -->

        </div>

    </div>

</div>



<!-- ======================================
     EXISTING TASKS JS
====================================== -->

<script
    src="js/tasks.js?v=1"
></script>


</body>

</html>
