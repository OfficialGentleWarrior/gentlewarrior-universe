<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Music Tasks | FORGE</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/tasks.css"
    >

</head>


<body>


<!-- ======================================
     FORGE HEADER
====================================== -->

<header class="topbar">

    <img
        src="assets/logo/forge-header.png"
        alt="FORGE"
        class="dashboard-logo"
    >

    <button
        class="notifications-btn"
        type="button"
        aria-label="Notifications"
    >

        <i class="fa-regular fa-bell"></i>

    </button>

</header>


<!-- ======================================
     PAGE
====================================== -->

<main class="tasks-container">


    <!-- Back -->

    <a
        href="tasks.html"
        class="back-btn"
    >

        <i class="fa-solid fa-arrow-left"></i>

        Tasks

    </a>


    <!-- Page Header -->

    <section class="page-header">

        <h1>
            Music
        </h1>

        <p>
            Support Gentle Warrior's music
        </p>

    </section>


    <!-- ======================================
         MUSIC TASKS
    ====================================== -->

    <section class="task-group">


        <!-- Group Header -->

        <div class="task-group-header">

            <div class="task-group-icon music-icon">

                <i class="fa-solid fa-music"></i>

            </div>

            <div>

                <h2>
                    Music
                </h2>

                <p>
                    Support Gentle Warrior's music
                </p>

            </div>

        </div>


        <!-- ==================================
             TASK 3
        ================================== -->

        <button
            class="task-card"
            type="button"
            data-task="follow_spotify"
        >

            <div class="task-card-icon music-icon">

                <i class="fa-brands fa-spotify"></i>

            </div>


            <div class="task-card-content">

                <h3>
                    Follow Gentle Warrior in Spotify
                </h3>

                <span>
                    Follow the artist and submit proof
                </span>

            </div>


            <div class="task-card-reward">

                <strong>
                    +1
                </strong>

                <small>
                    SPARK
                </small>

            </div>


            <div class="task-arrow">

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </button>


        <!-- ==================================
             TASK 4
        ================================== -->

        <button
            class="task-card"
            type="button"
            data-task="add_spotify_playlist"
        >

            <div class="task-card-icon music-icon">

                <i class="fa-brands fa-spotify"></i>

            </div>


            <div class="task-card-content">

                <h3>
                    Add Gentle Warrior to your Spotify playlist
                </h3>

                <span>
                    Add the music to your playlist and submit proof
                </span>

            </div>


            <div class="task-card-reward">

                <strong>
                    +1
                </strong>

                <small>
                    SPARK
                </small>

            </div>


            <div class="task-arrow">

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </button>


        <!-- ==================================
             TASK 5
        ================================== -->

        <button
            class="task-card"
            type="button"
            data-task="share_spotify"
        >

            <div class="task-card-icon music-icon">

                <i class="fa-brands fa-spotify"></i>

            </div>


            <div class="task-card-content">

                <h3>
                    Share Gentle Warrior in Spotify
                </h3>

                <span>
                    Share the music and submit proof
                </span>

            </div>


            <div class="task-card-reward">

                <strong>
                    +1
                </strong>

                <small>
                    SPARK
                </small>

            </div>


            <div class="task-arrow">

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </button>


        <!-- ==================================
             TASK 6
        ================================== -->

        <button
            class="task-card"
            type="button"
            data-task="listen_spotify"
        >

            <div class="task-card-icon music-icon">

                <i class="fa-brands fa-spotify"></i>

            </div>


            <div class="task-card-content">

                <h3>
                    Listen to Gentle Warrior in Spotify
                </h3>

                <span>
                    Listen to the music and submit proof
                </span>

            </div>


            <div class="task-card-reward">

                <strong>
                    +1
                </strong>

                <small>
                    SPARK
                </small>

            </div>


            <div class="task-arrow">

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </button>


    </section>


</main>


<!-- ======================================
     TASK MODAL
====================================== -->

<div
    class="task-modal"
    id="taskModal"
>

    <div class="task-modal-card">

        <button
            class="task-modal-close"
            type="button"
            aria-label="Close"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>


        <div id="taskModalContent">

            <!-- Task content loaded by JS -->

        </div>

    </div>

</div>


<script src="js/tasks.js"></script>


</body>

</html>
