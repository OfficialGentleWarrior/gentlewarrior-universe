name: Gentle Warrior Pages

on:
  push:
    branches: ["main"]
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "gentle-warrior-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: burning-well/package-lock.json

      - name: Install Burning Well dependencies
        working-directory: burning-well
        run: npm ci

      - name: Build Burning Well
        working-directory: burning-well
        run: npm run build -- --base=/burning-well/

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p _site

          rsync -av \
            --exclude='.git' \
            --exclude='burning-well' \
            ./ _site/

          mkdir -p _site/burning-well
          cp -R burning-well/dist/. _site/burning-well/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
