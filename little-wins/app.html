<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Little Wins</title>

    <link rel="icon"
          type="image/png"
          href="assets/logo/little-wins-icon.png">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">

</head>

<body>

    <!-- Header -->

    <header class="top-banner">

        <img
            src="assets/logo/little-wins-header.png"
            alt="Little Wins">

    </header>

    <main class="app-container">

        <!-- Welcome -->

        <section class="welcome-card">

    <div class="welcome-info">

        <p class="welcome-text">
            👋 Welcome back,
        </p>

        <h2 id="userName">
            Loading...
        </h2>

    </div>

    <img
    id="journeyPhoto"
    class="avatar"
    src="assets/avatar/default-avatar.png"
    alt="Journey Photo"
    title="Change Journey Photo">

</section>


        <!-- Daily Encouragement -->

        <section class="card">

            <h3>💚 Daily Encouragement</h3>

            <p id="dailyQuote">
                Every little win is proof that progress is possible.
            </p>

        </section>


        <!-- Journey Summary -->

        <section class="card">

            <h3>🌱 Journey Summary</h3>

            <div class="stats">

                <div class="stat">

                    <h2 id="journeyStarted">--</h2>

                    <p>Journey Started</p>

                </div>

                <div class="stat">

                    <h2 id="totalWins">0</h2>

                    <p>Little Wins</p>

                </div>

                <div class="stat">

                    <h2 id="streak">0</h2>

                    <p>Day Streak</p>

                </div>

            </div>

        </section>


        <!-- Record Button -->

        <button
    id="recordWin"
    class="record-button">

            ➕ Record Your First Little Win

        </button>


        <!-- Recent Little Wins -->

        <section class="card">

            <h3>📝 Recent Little Wins</h3>

            <div id="recentWins">

                <p>
    Your little wins will appear here.
</p>

            </div>

        </section>

    </main>


    <!-- Bottom Navigation -->

    <nav class="bottom-nav">

        <button id="navHome">
            🏠<br>Home
        </button>

        <button id="navJourney">
            🌱<br>Journey
        </button>

        <button id="navAdd">
            ➕<br>Add
        </button>

        <button id="navCommunity">
            🌍<br>Community
        </button>

        <button id="navProfile">
            👤<br>Profile
        </button>

    </nav>

<input
    type="file"
    id="journeyPhotoInput"
    accept="image/*"
    hidden>

    <script type="module" src="js/app.js"></script>

</body>

</html>
