<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Little Wins | Setup Your Journey</title>

    <meta
        name="description"
        content="Create your Little Wins journey in just a few simple steps.">

    <link
        rel="icon"
        type="image/png"
        href="assets/logo/little-wins-icon.png">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="top-banner">
    <img
        src="assets/logo/little-wins-header.png"
        alt="Little Wins">
</header>

    <!-- ==========================================
     WELCOME SCREEN
========================================== -->

<div
    id="welcomeScreen"
    class="container welcome-screen">

    <img
        src="assets/illustrations/welcome-journey.png"
        class="welcome-illustration"
        alt="Welcome Journey">

    <h2>

        Welcome! 💚

    </h2>

    <p class="subtitle">

        Every journey begins with a single step.

        <br>

        Let's create your journey.

    </p>

    <button id="continueSetup">

        Continue

    </button>

</div>
        <!-- ==========================================
             STEP 1
        =========================================== -->

        <div
    id="step1"
    class="container setup-screen hidden">

            <div class="progress">

                <div class="progress-fill"></div>

            </div>

            <h2>

                Who is this journey for?

            </h2>

            <p class="subtitle">

                Choose who this journey is for.

            </p>

            <button
                class="option-button"
                data-value="Myself">

                <span>👤 Myself</span>

                <span class="checkmark">✓</span>

            </button>

            <button
                class="option-button"
                data-value="My Child">

                <span>👶 My Child</span>

                <span class="checkmark">✓</span>

            </button>

            <button
                class="option-button"
                data-value="Family Member">

                <span>👨‍👩‍👧 Family Member</span>

                <span class="checkmark">✓</span>

            </button>

            <button
                class="option-button"
                data-value="Someone I Care For">

                <span>❤️ Someone I Care For</span>

                <span class="checkmark">✓</span>

            </button>

            <button
                id="step1Continue"
                disabled>

                Continue

            </button>

        </div>

    </main>

    <script
        type="module"
        src="js/setup.js">
    </script>

</body>

</html>
