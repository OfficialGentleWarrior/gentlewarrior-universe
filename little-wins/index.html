<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Little Wins | Every Little Win Matters.</title>

    <meta name="description"
          content="Capture every milestone, celebrate every step, and keep your journey alive—one little win at a time.">

    <link rel="icon"
          type="image/png"
          href="assets/logo/little-wins-icon.png">

    <link rel="stylesheet"
      href="css/style.css">

</head>

<body>

    <!-- ==========================================
         HEADER
    =========================================== -->

    <header>

        <div class="top-banner">

            <img
                src="assets/logo/little-wins-header.png"
                alt="Little Wins Logo">

        </div>

        <nav class="navbar">

            <div class="nav-left">

                <a href="#">Features</a>

                <a href="#">Community</a>

                <a href="#">FAQ</a>

            </div>

            <div class="nav-right">

                <button
                    id="navbarStart"
                    class="start-btn">

                    Get Started

                </button>

            </div>

        </nav>

    </header>

    <!-- ==========================================
         HERO
    =========================================== -->

    <main>

        <section class="hero">

            <div class="hero-left">

                <span class="hero-badge">

                    A Journey of Hope

                </span>

                <h1>

                    Every Little Win
                    Matters.

                </h1>

                <p>

                    Capture every milestone,
                    celebrate every step,
                    and keep your journey alive—
                    one little win at a time.

                </p>

                <div class="hero-buttons">

                    <button
                        id="heroStart"
                        class="primary">

                        Start Your Journey

                    </button>

                </div>

            </div>

        </section>

    </main>

    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer>

        <p>

            © 2026 Little Wins by Gentle Warrior

        </p>

    </footer>

    <!-- ==========================================
         SCRIPT
    =========================================== -->

    <script type="module">

        import { signInWithGoogle } from "./js/auth.js";

        document
            .getElementById("navbarStart")
            .addEventListener("click", signInWithGoogle);

        document
            .getElementById("heroStart")
            .addEventListener("click", signInWithGoogle);

    </script>

</body>

</html>
